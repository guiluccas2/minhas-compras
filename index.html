<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Compras</title>
<meta name="description" content="Estoque da casa, lista de compras e preços.">
<meta name="theme-color" content="#0d6b59">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<script>
  // aplica o tema antes de desenhar a página, para não piscar
  try { const t = localStorage.getItem("mc-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=1.4.1">
</head>
<body>
<div class="app">
  <aside id="side" class="side" aria-label="Menu"></aside>
  <main id="tela" class="tela"><p class="vazio">Carregando…</p></main>
  <nav id="nav" class="bnav" aria-label="Navegação"></nav>
</div>
<script>
  // Socorro: se o app não terminar de abrir (ex.: o aparelho misturou arquivos da versão anterior com os da nova),
  // mostra um botão que apaga a cópia guardada e abre a versão nova.
  (function () {
    function socorro() {
      var t = document.getElementById("tela");
      if (!t || t.textContent.trim() !== "Carregando…") return;
      t.innerHTML = '<div class="login"><div class="cartao"><h2>O app não terminou de abrir</h2>' +
        '<p class="sub">Provavelmente o aparelho guardou partes da versão anterior. Toque no botão para buscar a versão nova (os dados não se perdem).</p>' +
        '<button class="btn" id="socorro">Atualizar o app</button></div></div>';
      document.getElementById("socorro").onclick = limpar;
    }
    async function limpar() {
      try {
        var regs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < regs.length; i++) await regs[i].unregister();
        var ks = await caches.keys();
        for (var j = 0; j < ks.length; j++) await caches.delete(ks[j]);
      } catch (e) {}
      var q = new URLSearchParams(location.search); q.set("atualizar", Date.now()); location.replace(location.pathname + "?" + q + location.hash);
    }
    window.__socorroApp = socorro;
    addEventListener("error", function (e) { if (!e.target || !e.target.tagName || e.target.tagName === "SCRIPT") setTimeout(socorro, 300); }, true);
    setTimeout(socorro, 20000);
  })();
</script>
<!-- cada versão usa endereços novos para todos os arquivos: o navegador nunca mistura versão nova com antiga -->

} }</script>
